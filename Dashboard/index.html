<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark" data-web-base="../.." data-load-mode="iis">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Master Development | Koordinasyon Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23193db0'/><text x='16' y='22' text-anchor='middle' font-size='14' font-weight='700' fill='white' font-family='Segoe UI,sans-serif'>MD</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="shell sb-right" id="shell">

  <header class="hdr">
    <div class="brand" onclick="MD.go('overview')">
      <div class="bico"><i class="bi bi-diagram-3-fill"></i></div>
      <div>
        <div class="btxt">MASTER <span>DEV</span></div>
        <div class="bsub">Koordinasyon Merkezi</div>
      </div>
    </div>
    <div class="bc">
      <span>C:\web</span>
      <i class="bi bi-chevron-right" style="font-size:9px"></i>
      <span class="bc-c" id="bc"><i class="bi bi-speedometer2 me-1" style="color:var(--lcw)"></i>Genel Bakış</span>
    </div>
    <div class="hsp"></div>
    <div class="hact">
      <span class="statusbadge d-none d-md-inline-flex" id="hdrStatus">Yükleniyor…</span>
      <button type="button" class="hbtn" id="refreshBtn" title="Veriyi yenile" onclick="MD.refresh()">
        <i class="bi bi-arrow-clockwise" id="refreshIco"></i>
      </button>
      <button type="button" class="hbtn" id="hdrSbToggle" title="Kenar çubuğunu gizle" onclick="MD.toggleSbVisible()">
        <i class="bi bi-layout-sidebar-inset-reverse" id="hdrSbIco"></i>
      </button>
    </div>
  </header>

  <main class="main" id="vc"></main>

  <aside class="sb" id="sb">
    <div class="sbtop" onclick="MD.toggleSb()">
      <i class="bi bi-layout-sidebar-reverse" id="sbico"></i>
      <span>MENÜ</span>
    </div>
    <div class="sbscroll">
      <div class="nl">Koordinasyon</div>
      <div class="ni act" data-view="overview"><i class="bi bi-speedometer2"></i><span>Genel Bakış</span></div>
      <div class="ni" data-view="priorities"><i class="bi bi-exclamation-diamond"></i><span>Öncelikli İşler</span></div>
      <div class="ni" data-view="projects"><i class="bi bi-boxes"></i><span>Projeler</span></div>
      <div class="ni" data-view="activity"><i class="bi bi-activity"></i><span>Son Gelişmeler</span></div>
      <div class="ni" data-view="opportunities"><i class="bi bi-lightbulb"></i><span>Fırsatlar</span></div>

      <div class="nl">Referans</div>
      <div class="ni" data-view="agenda"><i class="bi bi-bookmark-star"></i><span>Gündem</span></div>
      <div class="ni" data-view="integrations"><i class="bi bi-share"></i><span>Entegrasyon Hatları</span></div>
      <div class="ni" data-view="docs"><i class="bi bi-journal-text"></i><span>Dokümanlar</span></div>

      <div class="nl">Sistem</div>
      <div class="ni" data-view="settings"><i class="bi bi-sliders"></i><span>Ayarlar</span></div>
    </div>
    <div class="sbft-wrap">
      <div class="sbft" title="Koordinasyon Agent">
        <div class="uavt" style="width:30px;height:30px;font-size:10px;background:linear-gradient(135deg,#193db0,#6f42c1)">MD</div>
        <div class="sbfi">
          <div class="sn">Master Development</div>
          <div class="sr" id="sbUpdated">—</div>
        </div>
      </div>
    </div>
  </aside>

</div>

<div class="app-toast" id="toast"></div>

<div class="modal fade" id="docMod" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content md-doc-modal">
      <div class="modal-header">
        <div>
          <h6 class="modal-title fw-bold mb-0" id="docModT">Doküman</h6>
          <div class="md-doc-path" id="docModPath"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="docModB"></div>
      <div class="modal-footer">
        <span class="text-muted me-auto" style="font-size:.72rem" id="docModMeta"></span>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Kapat</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/coord-parser.js"></script>
<script src="js/snapshot-client.js"></script>
<script src="js/shell.js"></script>
<script src="js/app.js"></script>
</body>
</html>
